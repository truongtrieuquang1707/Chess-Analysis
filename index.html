<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ Vua</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="board-area">
    <div class="player" id="playerTop"><span class="pname"></span><span class="pcap"></span><span class="clock" hidden></span></div>
    <div class="board-row">
      <div class="evalbar" id="evalbar" hidden><div class="evalbar-white"></div><span class="evalbar-text"></span></div>
      <div class="board" id="board">
        <div class="squares" id="squares"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
        <div class="pieces" id="pieces"></div>
        <div class="badge" id="badge" hidden></div>
        <div class="promo" id="promo" hidden></div>
      </div>
    </div>
    <div class="player" id="playerBottom"><span class="pname"></span><span class="pcap"></span><span class="clock" hidden></span></div>
  </section>

  <aside class="panel">
    <header class="panel-head">
      <h1 data-i18n="title">Cờ Vua</h1>
      <span class="engine-tag" id="engineTag"></span>
      <button class="btn lang" id="btnLang" data-i18n="lang_btn" data-i18n-title="tip_lang">EN</button>
    </header>

    <div class="status" id="status"></div>
    <button class="btn primary wide" id="btnReview" data-i18n="btn_review" hidden>Phân tích ván đấu</button>

    <div class="captures" id="captures" data-i18n-title="cap_title"></div>

    <section class="review" id="review" hidden>
      <div class="progress" id="progress">
        <div class="progress-bar"><i id="progressFill"></i></div>
        <span id="progressText"></span>
      </div>
      <div id="reviewBody" hidden>
        <div class="summary" id="summary"></div>
        <details class="lessons" id="lessons"></details>
        <div class="graph" id="graph"></div>
        <div class="explore" id="explore" hidden></div>
        <div class="comment" id="comment"></div>
      </div>
    </section>

    <div class="moves" id="moves"></div>

    <div class="nav" id="nav" hidden>
      <button class="btn" data-nav="first" title="Home">⏮</button>
      <button class="btn" data-nav="prev" title="←">◀</button>
      <button class="btn" data-nav="next" title="→">▶</button>
      <button class="btn" data-nav="last" title="End">⏭</button>
    </div>

    <div class="controls">
      <button class="btn" id="btnNew" data-i18n="btn_new">Ván mới</button>
      <button class="btn" id="btnUndo" data-i18n="btn_undo">Đi lại</button>
      <button class="btn" id="btnResign" data-i18n="btn_resign">Đầu hàng</button>
      <button class="btn" id="btnFlip" data-i18n-title="tip_flip">⇅</button>
      <button class="btn" id="btnSound" data-i18n-title="tip_sound">🔊</button>
      <button class="btn" id="btnMusic" data-i18n-title="tip_music">🎵</button>
    </div>

    <div class="music-panel" id="musicPanel" hidden>
      <div class="mp-head">
        <b data-i18n="mu_title">Nhạc nền</b>
        <label class="switch"><input type="checkbox" id="muOn"><span></span></label>
      </div>
      <ol class="mp-list" id="muList"></ol>
      <label class="mp-vol"><span data-i18n="mu_vol">Âm lượng nhạc</span><input type="range" id="muVol" min="0" max="100"></label>
      <label class="mp-vol"><span data-i18n="mu_sfx">Âm lượng hiệu ứng</span><input type="range" id="sfxVol" min="0" max="100"></label>
    </div>
  </aside>
</main>

<dialog id="dlgNew">
  <form method="dialog" id="formNew">
    <h2 data-i18n="dlg_title">Ván mới</h2>
    <div class="field">
      <label data-i18n="f_opp">Đối thủ</label>
      <div class="seg" data-name="opp">
        <button type="button" data-v="ai" data-i18n="o_ai">Máy</button>
        <button type="button" data-v="human" data-i18n="o_human">Hai người</button>
      </div>
    </div>
    <div class="field" id="fieldSide">
      <label data-i18n="f_side">Bạn cầm quân</label>
      <div class="seg" data-name="side">
        <button type="button" data-v="0" data-i18n="s_white">Trắng</button>
        <button type="button" data-v="1" data-i18n="s_black">Đen</button>
        <button type="button" data-v="r" data-i18n="s_random">Ngẫu nhiên</button>
      </div>
    </div>
    <div class="field" id="fieldElo">
      <label><span data-i18n="f_elo">Elo của máy</span>: <b id="eloValue"></b></label>
      <input type="range" id="eloRange" min="250" max="3200" step="50" value="1000">
    </div>
    <div class="field">
      <label data-i18n="f_time">Thời gian</label>
      <div class="seg wrap" data-name="tc">
        <button type="button" data-v="0">∞</button>
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">3</button>
        <button type="button" data-v="3">3 | 2</button>
        <button type="button" data-v="4">5</button>
        <button type="button" data-v="5">10</button>
        <button type="button" data-v="6">15 | 10</button>
        <button type="button" data-v="7">30</button>
      </div>
    </div>
    <div class="dlg-actions">
      <button class="btn" value="cancel" data-i18n="cancel">Hủy</button>
      <button class="btn primary" value="ok" data-i18n="start">Bắt đầu</button>
    </div>
  </form>
</dialog>

<script src="js/i18n.js"></script>
<script src="js/chess.js"></script>
<script src="js/openings.js"></script>
<script src="js/music.js"></script>
<script src="js/engine.js"></script>
<script src="js/review.js"></script>
<script src="js/app.js"></script>
</body>
</html>
